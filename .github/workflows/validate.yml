name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          if not text.startswith("---"):
              sys.exit("SKILL.md must start with YAML frontmatter")
          fm = text.split("---", 2)[1]
          name = re.search(r"^name:\s*(\S+)", fm, re.M)
          desc = re.search(r"^description:\s*(.+)$", fm, re.M)
          assert name, "frontmatter: missing name"
          assert desc, "frontmatter: missing description"
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name.group(1)), f"invalid skill name: {name.group(1)}"
          assert 20 <= len(desc.group(1)) <= 1024, "description should be 20-1024 chars"
          print("frontmatter ok:", name.group(1))
          PY

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate manifests and documentation set
        run: |
          python - <<'PY'
          import json, pathlib, sys
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          assert plugin["version"] == market["plugins"][0]["version"], "version mismatch"
          print("version ok:", plugin["version"])
          for f in ("README.md", "README.zh-CN.md", "README.ja.md", "README.ko.md", "LICENSE", "CHANGELOG.md"):
              assert pathlib.Path(f).stat().st_size > 0, f"missing: {f}"
          print("documentation set ok")
          PY

      - name: No dangling relative links or deleted build paths
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          docs = list(pathlib.Path(".").glob("*.md")) + list(pathlib.Path("references").glob("*.md"))
          for md in docs:
              for m in re.finditer(r"\]\(([^)#\s]+)(?:#[^)]*)?\)", md.read_text(encoding="utf-8")):
                  target = m.group(1)
                  if target.startswith(("http", "mailto")):
                      continue
                  if not (md.parent / target).resolve().exists():
                      bad.append(f"{md}: {target}")
          assert not bad, "broken links:\n" + "\n".join(bad)
          stale = ("assets/starter", "img2threejs/PIPELINE.md", "scripts/scaffold.py", "references/asset-craft.md")
          for p in list(docs) + list(pathlib.Path("scripts").glob("*.py")):
              if p.name == "CHANGELOG.md":
                  continue  # history may name files that no longer exist
              text = p.read_text(encoding="utf-8")
              for token in stale:
                  assert token not in text, f"{p} still references deleted path {token}"
          print(f"links ok: {len(docs)} documents")
          PY

      - name: Smoke-check the auditor on a fixture
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile
          fixture = '''<!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>ok</title><style>@media (prefers-reduced-motion:reduce){*{animation:none}}</style></head>
          <body><canvas id="cv"></canvas><script>addEventListener('error',()=>{});
          addEventListener('unhandledrejection',()=>{});document.getElementById('cv').focus();</script>
          </body></html>'''
          with tempfile.TemporaryDirectory() as d:
              p = pathlib.Path(d) / "game.html"
              p.write_text(fixture, encoding="utf-8")
              r = subprocess.run([sys.executable, "scripts/check_single_file.py", str(p), "--strict"],
                                 capture_output=True, text=True)
              assert r.returncode == 0, r.stdout + r.stderr
              assert "3D asset gates skipped" in r.stdout, r.stdout
          print("auditor smoke ok")
          PY
